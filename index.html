<script>
// Attendance engine. Pure functions, minutes as integers.
const DEFAULTS = {
  earliest: '06:30', latest: '07:45', capWeek: '15:45', capFri: '12:15',
  hoursWeek: 8, hoursFri: 4.5, allowance: 3, grace: 23, resetDay: 15
};
function tm(s) { if (!s) return null; const [h, m] = s.split(':').map(Number); return h * 60 + m; }
function fmt(m) { if (m == null) return ''; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function ds(dt) { return dt.toISOString().slice(0, 10); }
function addDays(s, n) { const d = pd(s); d.setUTCDate(d.getUTCDate() + n); return ds(d); }
function dow(s) { return pd(s).getUTCDay(); } // 0 Sun .. 6 Sat
function cycleStart(s, resetDay) {
  const [y, m, d] = s.split('-').map(Number);
  if (d >= resetDay) return `${y}-${String(m).padStart(2, '0')}-${String(resetDay).padStart(2, '0')}`;
  const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y;
  return `${py}-${String(pm).padStart(2, '0')}-${String(resetDay).padStart(2, '0')}`;
}
function cycleEnd(start) { // day before next reset day
  const [y, m, d] = start.split('-').map(Number);
  const nm = m === 12 ? 1 : m + 1, ny = m === 12 ? y + 1 : y;
  return addDays(`${ny}-${String(nm).padStart(2, '0')}-${String(d).padStart(2, '0')}`, -1);
}
function reqHours(date, S) { const w = dow(date); if (w === 0 || w === 6) return 0; return w === 5 ? S.hoursFri : S.hoursWeek; }
function capOf(date, S) { return dow(date) === 5 ? tm(S.capFri) : tm(S.capWeek); }

// Compute one cycle. recs: map date -> {i,o,x,n,s}
function computeCycle(start, recs, S) {
  S = Object.assign({}, DEFAULTS, S || {});
  const end = cycleEnd(start);
  let g = S.grace, q = S.allowance;
  const rows = [];
  const sum = { days: 0, hours: 0, late: 0, early: 0, lpen: 0, epen: 0, pen: 0, ded: 0, extra: 0, mail: 0, missing: 0, grace: S.grace, allow: S.allowance };
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const r = recs[d] || {};
    const req = reqHours(d, S) ;
    const tin = tm(r.i), tout = tm(r.o);
    const mail = r.x === 'mail';
    const K = (tin != null && req > 0) ? Math.max(0, tin - tm(S.latest)) : 0;
    const exp = (tin != null && req > 0) ? Math.min(Math.max(tin, tm(S.earliest)), tm(S.latest)) + Math.round(req * 60) : null;
    const N = (mail || K <= 0) ? 0 : Math.ceil(Math.max(0, K - g) / 60);
    g = Math.max(0, g - (mail ? 0 : K));
    const M = (tin != null && tout != null && req > 0 && exp != null) ? Math.max(0, exp - tout) : 0;
    const O = (mail || M <= 0) ? 0 : Math.ceil(M / 60);
    const P = mail ? 0 : N + O;
    const R = Math.max(0, P - q);
    q = Math.max(0, q - P);
    const bad = tin != null && tout != null && tout < tin;
    const J = (tin != null && tout != null && !bad) ? Math.round((tout - tin) / 60 * 100) / 100 : 0;
    let extra = 0;
    if (tin != null && tout != null && exp != null && !bad) { extra = Math.max(0, Math.min(tout, capOf(d, S)) - exp); }
    const w = dow(d);
    let st;
    if (mail) st = 'Administrative Excuse';
    else if (w === 0 || w === 6) st = 'Weekend';
    else if (tin == null && tout == null) st = (w === 5 ? 'Friday (4.5h)' : '');
    else if (tin == null || tout == null) st = 'Missing Punch';
    else if (R > 0) st = 'Deduction Applied';
    else if (P > 0) st = 'Covered by Allowance';
    else st = 'Completed';
    rows.push({ d, req, C: req, in: r.i || '', out: r.o || '', x: r.x || 'none', n: r.n || '', s: r.s || '', exp, J, K, L: g, M, N, O, P, Q: q, R, S: st, extra, bad });
    if (J > 0) sum.days++;
    sum.hours += J; sum.late += K; sum.early += M; sum.lpen += N; sum.epen += O; sum.pen += P; sum.ded += R; sum.extra += extra;
    if (st === 'Administrative Excuse') sum.mail++;
    if (st === 'Missing Punch') sum.missing++;
  }
  sum.hours = Math.round(sum.hours * 100) / 100;
  sum.grace = g; sum.allow = q;
  return { start, end, rows, sum };
}
// Live status for today
function liveInfo(date, nowMin, rec, prayer, S) {
  S = Object.assign({}, DEFAULTS, S || {});
  const w = dow(date), req = reqHours(date, S);
  const out = {};
  if (req === 0) { out.kind = 'weekend'; return out; }
  const tin = tm(rec && rec.i), tout = tm(rec && rec.o);
  out.signedIn = tin != null; out.signedOut = tout != null;
  if (tin != null) {
    out.exp = Math.min(Math.max(tin, tm(S.earliest)), tm(S.latest)) + Math.round(req * 60);
    out.remaining = out.exp - nowMin;
  }
  out.cap = capOf(date, S);
  const p = prayer && prayer[date];
  if (p) { out.prayerTime = w === 5 ? tm(p[3]) : tm(p[4]); }
  else { out.prayerTime = w === 5 ? 11 * 60 + 45 : 14 * 60 + 30; }
  out.prayerName = w === 5 ? 'الجمعة' : 'العصر';
  out.prayerDiff = out.prayerTime - nowMin;
  return out;
}

  for(let k=1;k<=last;k++){const dd=`${y}-${pad(m)}-${pad(k)}`;const cs=cycleStart(dd,S().resetDay);if(!cycles[cs])cycles[cs]=computeCycle(cs,DB.days,S())}
  const rows={};Object.values(cycles).forEach(c=>c.rows.forEach(r=>rows[r.d]=r));
  const t=todayStr();
  let html=`<div class="nav"><button id="mn">›</button><b>${AR_MON[m-1]} ${y}</b><button id="mp">‹</button></div>`;
  for(let k=1;k<=last;k++){
    const dd=`${y}-${pad(m)}-${pad(k)}`,r=rows[dd],w=dow(dd);
    const we=r.req===0;
    const late=r.K>0&&r.x!=='mail'&&r.req>0;
    html+=`<div class="day ${dd===t?'today':''} ${we&&!r.in?'we':''} ${late?'late':''}" data-d="${dd}"><div class="dn"><b>${k}</b><span>${AR_DAYS[w]}</span></div>
     <div class="mid"><div class="t"><span class="${late?'t red':''}">${late?'● ':''}${r.in||'--:--'}</span> → ${r.out||'--:--'}</div>
     <div class="sub">${r.K?'تأخير '+r.K+'د · ':''}${r.M&&r.x!=='mail'?'مبكر '+r.M+'د · ':''}${r.P?'جزاء '+r.P+'س · ':''}${r.x!=='none'?xLabel(r.x)+' · ':''}${r.s||''}${r.n?' · '+r.n:''}</div></div>${r.in&&!r.out&&dd===t?'<span class="chip c-Fri">داخل</span>':stChip(r.S)}</div>`;
  }
  $('#main').innerHTML=html;
  $('#mn').onclick=()=>{monthRef=m===12?`${y+1}-01`:`${y}-${pad(m+1)}`;rMonth()};
  $('#mp').onclick=()=>{monthRef=m===1?`${y-1}-12`:`${y}-${pad(m-1)}`;rMonth()};
  document.querySelectorAll('.day').forEach(e=>e.onclick=()=>editDay(e.dataset.d));
}
function editDay(d){
  const r=DB.days[d]||{};
  $('#sheet').innerHTML=`<div class="h">${dlabel(d)}</div>
   <div class="grid2"><div><label>وقت الدخول</label><input type="time" id="eIn" value="${r.i||''}"></div><div><label>وقت الخروج</label><input type="time" id="eOut" value="${r.o||''}"></div></div>
   <label>نوع الإذن</label><select id="eX"><option value="none">عادي</option><option value="system">إذن على السيستم (من الرصيد)</option><option value="mail">Mail sent (مفيش خصم)</option></select>
   <label>الموقع / العميل</label><input id="eS" value="${(r.s||'').replace(/"/g,'&quot;')}">
   <label>ملاحظات</label><textarea id="eN" rows="2">${r.n||''}</textarea>
   <div id="eErr" class="bad hide"></div>
   <div class="row" style="margin-top:14px"><button class="btn sm" id="eSave" style="flex:1">حفظ</button><button class="btn sm ghost" id="eCancel">إلغاء</button><button class="btn sm danger" id="eDel">مسح اليوم</button></div>`;
  $('#eX').value=r.x||'none';
  $('#modal').classList.add('on');
  $('#eCancel').onclick=closeModal;
  $('#eDel').onclick=()=>{if(confirm('تمسح بيانات اليوم ده؟')){delete DB.days[d];save();closeModal();render()}};
  $('#eSave').onclick=()=>{
    const i=$('#eIn').value,o=$('#eOut').value;
    if(i&&o&&o<i){const e=$('#eErr');e.textContent='وقت الخروج قبل الدخول. مفيش شيفتات ليلية في النسخة دي.';e.classList.remove('hide');return}
    const x=$('#eX').value,n=$('#eN').value.trim(),s=$('#eS').value.trim();
    DB.days[d]={i,o,x,n,s};if(!i&&!o&&x==='none'&&!n&&!s)delete DB.days[d];

  };

// ---------- CYCLE ----------
function rCycle(){
  const c=computeCycle(cycRef,DB.days,S()),s=c.sum,A=S().allowance;
  const lbl=x=>{const [y,m,d]=x.split('-').map(Number);return d+' '+AR_MON[m-1]};
  let html=`<div class="nav"><button id="cn">›</button><b>${lbl(c.start)} → ${lbl(c.end)}</b><button id="cp">‹</button></div>`;
  html+=`<div class="card"><div class="h">الخصم</div><div class="kv">
   <div><span>ساعات الجزاء (تأخير + مبكر)</span><b>${s.pen}</b></div>
   <div><span>الرصيد المتبقي من ${A}</span><b>${s.allow}</b></div>
   <div><span>الخصم الفعلي (ساعة)</span><b>${s.ded}</b></div>
   <div><span>سماح التأخير المتبقي (د)</span><b>${s.grace}</b></div></div>
   ${s.ded>0?'<div class="bad" style="margin-top:10px">الرصيد خلص وفيه '+s.ded+' ساعة خصم فعلي.</div>':''}</div>`;
  html+=`<div class="card"><div class="h">تفاصيل</div><div class="kv">
   <div><span>أيام الشغل</span><b>${s.days}</b></div>
   <div><span>ساعات الشغل الفعلية</span><b>${s.hours.toFixed(2)}</b></div>
   <div><span>دقائق التأخير</span><b>${s.late}</b></div>
   <div><span>دقائق الانصراف المبكر</span><b>${s.early}</b></div>
   <div><span>جزاء تأخير (س)</span><b>${s.lpen}</b></div>
   <div><span>جزاء انصراف مبكر (س)</span><b>${s.epen}</b></div>
   <div><span>أيام Mail sent</span><b>${s.mail}</b></div>
   <div><span>أيام بصمة ناقصة</span><b>${s.missing}</b></div></div>
   <p class="note" style="margin:10px 0 0">معلومة فقط: الوقت اللي قعدته بعد الوقت المطلوب لحد السقف = <b class="ltr">${dur(s.extra)}</b>. مش أوفر تايم ومش بيدخل الحساب.</p></div>`;
  html+=`<div class="card"><div class="h">أيام فيها جزاء أو مشكلة</div>`+
   (c.rows.filter(r=>r.P>0||r.S==='Missing Punch'||r.S==='Administrative Excuse').map(r=>`<div class="day" data-d="${r.d}" style="box-shadow:none;padding:6px 0"><div class="dn"><b>${+r.d.slice(8)}</b><span>${AR_DAYS[dow(r.d)]}</span></div><div class="mid"><div class="t">${r.in||'--:--'} → ${r.out||'--:--'}</div><div class="sub">${r.K?'تأخير '+r.K+'د · ':''}${r.M?'مبكر '+r.M+'د · ':''}جزاء ${r.P}س</div></div>${stChip(r.S)}</div>`).join('')||'<p class="note">مفيش.</p>')+`</div>`;
  $('#main').innerHTML=html;
  const step=n=>{const [y,m]=cycRef.split('-').map(Number);let nm=m+n,ny=y;if(nm>12){nm=1;ny++}if(nm<1){nm=12;ny--}cycRef=`${ny}-${pad(nm)}-${pad(S().resetDay)}`;rCycle()};
  $('#cn').onclick=()=>step(1);$('#cp').onclick=()=>step(-1);
  document.querySelectorAll('.day').forEach(e=>e.onclick=()=>editDay(e.dataset.d));
}

     if(!confirm('الاستيراد هيستبدل كل البيانات الحالية بالنسخة ('+Object.keys(j.days).length+' يوم). تكمل؟'))return;
     DB={v:1,settings:j.settings||{},days:j.days,prayer:(j.prayer&&Object.keys(j.prayer).length?j.prayer:DB.prayer)};save();$('#impMsg').innerHTML='<div class="ok">تم الاستيراد.</div>';render()}catch(x){$('#impMsg').innerHTML='<div class="bad">الملف مش نسخة صالحة.</div>'}};r.readAsText(f)};
  $('#sReset').onclick=()=>{if(confirm('ده هيمسح كل الأيام اللي سجلتها من الموبايل ده. متأكد إنك خدت نسخة احتياطية؟')){localStorage.removeItem&&(()=>{try{localStorage.removeItem(KEY)}catch(e){}})();DB=load();save();render()}};

function dl(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},500)}
function exportCsv(){
  const ds=Object.keys(DB.days).sort();if(!ds.length){toast('مفيش بيانات.');return}

  ds.forEach(d=>{const cst=cycleStart(d,S().resetDay);cs[cst]=cs[cst]||computeCycle(cst,DB.days,S());const r=cs[cst].rows.find(x=>x.d===d);
   const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
   out.push([d,AR_DAYS[dow(d)],r.in,r.out,r.x,r.exp!=null?fmt(r.exp):'',r.J,r.K,r.L,r.M,r.N,r.O,r.P,r.Q,r.R,q(r.S),q(r.s),q(r.n)].join(','))});

}
